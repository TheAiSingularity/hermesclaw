name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          bash -n scripts/hermesclaw
          bash -n scripts/lib/hermesclaw-helpers.sh

      - name: ShellCheck lint
        run: |
          shellcheck -x -s bash scripts/hermesclaw
          shellcheck -x -s bash scripts/lib/hermesclaw-helpers.sh

      - name: Test — Registry and validation
        run: bash scripts/test-registry.sh

      - name: Test — CLI dispatch
        run: bash scripts/test-dispatch.sh

      - name: Test — Credential detection
        run: bash scripts/test-credentials.sh
